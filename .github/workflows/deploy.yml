name: Deploy to GitHub Pages

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Check deployment update behavior
        run: node script/probe/check-deployment-updates.mjs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Find previous deployment artifact for initial asset retention
        id: previous
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: "deploy.yml", branch: "release", status: "success", per_page: 1,
            });
            const run = data.workflow_runs[0];
            if (!run) return;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: run.id });
            if (artifacts.data.artifacts.some(artifact => artifact.name === "github-pages" && !artifact.expired)) {
              core.setOutput("run-id", String(run.id));
            }

      - name: Download previous Pages artifact
        if: steps.previous.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/previous-pages-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run-id }}

      - name: Extract previous Pages site
        if: steps.previous.outputs.run-id != ''
        run: |
          mkdir -p "$RUNNER_TEMP/previous-pages-site"
          tar -xf "$RUNNER_TEMP/previous-pages-artifact/artifact.tar" -C "$RUNNER_TEMP/previous-pages-site"

      - name: Retain previous assets for seven days
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node script/deploy/retain-assets.mjs dist "$RUNNER_TEMP/previous-pages-site" "$SITE_URL"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
